[project]
name = "laverdad"
version = "0.1.0"
description = "Sin Sesgo: agregador de cobertura noticiosa chilena (catálogo, RSS y clustering)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
]

[project.scripts]
laverdad = "laverdad.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
